<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>V40 Router-C — Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
  :root{--bg-primary:#0a0d14;--bg-secondary:#13181f;--border:#232932;--text-primary:#e8ecf3;--text-secondary:#8a95a5;--green:#16c784;--red:#ea3943;--yellow:#f5a623;--blue:#3861fb;}
  body{background:var(--bg-primary);color:var(--text-primary);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  .font-mono{font-family:'JetBrains Mono',monospace;font-feature-settings:'tnum';}
  ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
  @keyframes pulse-glow{0%,100%{opacity:1;}50%{opacity:0.6;}}.pulse-dot{animation:pulse-glow 2s infinite;}
  .glass{background:rgba(19,24,31,0.85);backdrop-filter:blur(12px);}
</style>
</head>
<body class="min-h-screen pb-8">

<div class="sticky top-0 z-40 glass border-b border-[#232932]">
    <div class="max-w-[1400px] mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex-1 min-w-0 pr-3">
            <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-[#16c784] pulse-dot"></div><h1 class="text-lg font-black tracking-tight">V40 <span class="text-[#8a95a5] font-mono text-xs">Live (Cloud)</span></h1></div>
            <div id="scan-status" class="text-[11px] text-[#8a95a5] font-mono mt-0.5 truncate">Đang tải dữ liệu...</div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="loadLiveData(true)" class="bg-[#f5a623] text-black px-4 py-2 rounded-lg font-bold hover:bg-[#f5a623]/90 text-xs">Làm mới</button>
        </div>
    </div>
</div>

<div class="max-w-[1400px] mx-auto p-4 space-y-4">
  <!-- MACRO BOX -->
  <div class="bg-[#13181f] border border-[#232932] rounded-2xl p-4">
      <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
          <div class="flex items-center gap-2"><span class="text-xs font-black text-[#e8ecf3] uppercase tracking-wider">🎯 BTC Vĩ Mô</span><span id="btc-zone-badge" class="px-2.5 py-1 rounded-lg text-[10px] font-black uppercase font-mono bg-[#1a1f28] text-[#8a95a5]">--</span></div>
          <div class="flex items-center gap-2 bg-[#0a0d14] border border-[#232932] rounded-lg px-3 py-1.5"><span class="text-[9px] text-[#8a95a5] font-black uppercase">Router</span><span id="router-mode" class="font-mono font-black text-[#8a95a5] text-xs">--</span></div>
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
          <div class="bg-[#0a0d14] border border-[#232932] rounded-xl p-3"><div class="text-[9px] text-[#8a95a5] font-black uppercase mb-1">BTC</div><div id="btc-macro-pos" class="font-mono font-bold text-[#e8ecf3] text-sm">--</div></div>
          <div class="bg-[#0a0d14] border border-[#232932] rounded-xl p-3"><div class="text-[9px] text-[#8a95a5] font-black uppercase mb-1">30d</div><div id="btc-30d" class="font-mono font-bold text-[#8a95a5] text-sm">--</div></div>
          <div class="bg-[#0a0d14] border border-[#232932] rounded-xl p-3"><div class="text-[9px] text-[#8a95a5] font-black uppercase mb-1">60d</div><div id="btc-60d" class="font-mono font-bold text-[#8a95a5] text-sm">--</div></div>
          <div class="bg-[#0a0d14] border border-[#232932] rounded-xl p-3"><div class="text-[9px] text-[#8a95a5] font-black uppercase mb-1">Breadth (>EMA50)</div><div id="btc-breadth" class="font-mono font-bold text-[#f5a623] text-sm">--</div></div>
          <div class="bg-[#0a0d14] border border-[#232932] rounded-xl p-3"><div class="text-[9px] text-[#8a95a5] font-black uppercase mb-1">Exposure</div><div id="btc-macro-atr" class="font-mono font-bold text-[#16c784] text-sm">--</div></div>
      </div>
  </div>

  <!-- STATS -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-[#13181f] border border-[#232932] rounded-2xl p-4"><div class="text-[10px] text-[#8a95a5] font-black uppercase mb-1">Đang Mở</div><div id="stat-running" class="text-2xl font-black text-[#3861fb] font-mono">0</div></div>
      <div class="bg-[#13181f] border border-[#232932] rounded-2xl p-4"><div class="text-[10px] text-[#8a95a5] font-black uppercase mb-1">Winrate</div><div id="stat-winrate" class="text-2xl font-black text-[#16c784] font-mono">0%</div><div id="stat-partial" class="text-[10px] text-[#8a95a5] font-bold mt-0.5">0W / 0L</div></div>
      <div class="bg-[#13181f] border border-[#232932] rounded-2xl p-4"><div class="text-[10px] text-[#8a95a5] font-black uppercase mb-1">Kỳ Vọng</div><div id="stat-expectancy" class="text-2xl font-black text-[#e8ecf3] font-mono">0.00R</div></div>
      <div class="bg-[#13181f] border border-[#232932] rounded-2xl p-4">
          <div class="flex justify-between items-center mb-1"><span class="text-[10px] text-[#8a95a5] font-black uppercase">NET</span></div>
          <div id="stat-pnl-usd" class="text-2xl font-black font-mono">$0</div>
          <div class="flex justify-between items-center mt-0.5"><span id="stat-pnl" class="text-[10px] font-bold font-mono">0.00R</span><span id="stat-count" class="text-[9px] text-[#8a95a5] font-bold"></span></div>
      </div>
  </div>

  <!-- TABS -->
  <div class="flex gap-2 p-1 bg-[#13181f] border border-[#232932] rounded-2xl">
      <button id="tab-btn-opp" onclick="switchMainTab('opp')" class="flex-1 py-3 text-sm font-black rounded-xl transition-all bg-[#f5a623] text-black flex items-center justify-center gap-2">🎯 CƠ HỘI</button>
      <button id="tab-btn-history" onclick="switchMainTab('history')" class="flex-1 py-3 text-sm font-black rounded-xl transition-all text-[#8a95a5] hover:text-[#e8ecf3] flex items-center justify-center gap-2">📖 LỊCH SỬ</button>
  </div>

  <div id="section-opp" class="space-y-4 block">
      <div id="running-section" class="space-y-3"></div>
      <div id="waiting-section" class="space-y-3"></div>
  </div>

  <div id="section-history" class="space-y-4 hidden">
      <div id="closed-board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>
</div>

<script>
let globalLogs = [];
let currentBtcRegime = null;

function switchMainTab(tabName){
    const tabs=['opp','history'];const sections={opp:'section-opp',history:'section-history'};const btns={opp:'tab-btn-opp',history:'tab-btn-history'};
    tabs.forEach(t=>{const btn=document.getElementById(btns[t]);const sec=document.getElementById(sections[t]);
        if(t===tabName){btn.className="flex-1 py-3 text-sm font-black rounded-xl transition-all bg-[#f5a623] text-black flex items-center justify-center gap-2";sec.style.display='block';}
        else{btn.className="flex-1 py-3 text-sm font-black rounded-xl transition-all text-[#8a95a5] hover:text-[#e8ecf3] flex items-center justify-center gap-2";sec.style.display='none';}
    });
}

const formatPrice=(p)=>{if(!p&&p!==0)return'--';const ap=Math.abs(p);if(ap===0)return'0';if(ap<0.00001)return p.toFixed(8);if(ap<0.0001)return p.toFixed(7);if(ap<0.001)return p.toFixed(6);if(ap<0.01)return p.toFixed(5);if(ap<1)return p.toFixed(4);if(ap<100)return p.toFixed(3);return p.toFixed(2);};
const formatTime=(ms)=>{if(!ms)return'--';const d=new Date(ms);return`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;};

function getStateColor(state){
    if(state==='WAITING')return{text:'#f5a623',bg:'rgba(245,166,35,0.1)',border:'rgba(245,166,35,0.3)'};
    if(state==='RUNNING')return{text:'#3861fb',bg:'rgba(56,97,251,0.1)',border:'rgba(56,97,251,0.3)'};
    if(state==='SL')return{text:'#ea3943',bg:'rgba(234,57,67,0.1)',border:'rgba(234,57,67,0.3)'};
    if(state==='TP')return{text:'#16c784',bg:'rgba(22,199,132,0.1)',border:'rgba(22,199,132,0.3)'};
    if(state==='EXPIRED')return{text:'#8a95a5',bg:'rgba(138,149,165,0.1)',border:'rgba(138,149,165,0.3)'};
    return{text:'#8a95a5',bg:'rgba(138,149,165,0.1)',border:'rgba(138,149,165,0.3)'};
}

function getZoneColor(zone){
    if(zone==='LOWER')return{text:'#16c784',bg:'rgba(22,199,132,0.12)'};
    if(zone==='SHORT_VAH')return{text:'#ea3943',bg:'rgba(234,57,67,0.12)'};
    return{text:'#8a95a5',bg:'rgba(138,149,165,0.12)'};
}

function buildCard(s) {
    const zoneColor = getZoneColor(s.zone);
    const stColor = getStateColor(s.state);
    const isShort = s.type === 'SHORT';
    const sideColor = isShort ? '#ea3943' : '#16c784';
    const netR = s.eval?.netR || 0;
    const netStr = s.eval?.isComplete ? (netR > 0 ? '+' : '') + netR.toFixed(2) + 'R' : (s.state === 'RUNNING' ? '~ ' + netR.toFixed(2) + 'R' : '');
    
    return `<div class="relative bg-[#13181f] border border-[#232932] rounded-2xl overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-1" style="background:${sideColor}"></div>
        <div class="p-4 pl-5">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <div class="flex items-center gap-1.5 flex-wrap mb-1">
                        <span class="text-xl font-black text-[#e8ecf3]">${s.sym.replace('USDT','')}</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded" style="background:${zoneColor.bg};color:${zoneColor.text}">${s.zone}</span>
                    </div>
                    <div class="text-xs font-bold" style="color:${sideColor}">${isShort?'SHORT':'LONG'} · RR ${(s.rr||0).toFixed(1)}R</div>
                </div>
                <div class="text-right flex flex-col items-end gap-1">
                    <span class="text-[10px] font-black px-2 py-0.5 rounded" style="background:${stColor.bg};color:${stColor.text};border:1px solid ${stColor.border}">${s.state}</span>
                    ${netStr?`<div class="font-bold font-mono text-sm" style="color:${netR>0?'#16c784':(netR<0?'#ea3943':'#8a95a5')}">${netStr}</div>`:''}
                </div>
            </div>
            <div class="grid grid-cols-3 gap-1 bg-[#0a0d14] rounded-xl p-2 mb-3 border border-[#232932]">
                <div class="text-center"><div class="text-[9px] text-[#8a95a5] font-bold uppercase">Entry</div><div class="text-xs font-bold font-mono text-[#e8ecf3]">${formatPrice(s.avgEntry)}</div></div>
                <div class="text-center border-l border-[#232932]"><div class="text-[9px] text-[#ea3943] font-bold uppercase">SL</div><div class="text-xs font-bold font-mono text-[#ea3943]">${formatPrice(s.slTarget)}</div></div>
                <div class="text-center border-l border-[#232932]"><div class="text-[9px] text-[#16c784] font-bold uppercase">TP</div><div class="text-xs font-bold font-mono text-[#16c784]">${formatPrice(s.tpTarget)}</div></div>
            </div>
            <div class="flex justify-between text-[10px] text-[#8a95a5] font-bold">
                <span>Tạo: <span class="font-mono text-[#e8ecf3]">${formatTime(s.sigT)}</span></span>
                <span>Khớp: <span class="font-mono text-[#e8ecf3]">${s.eval?.fillTime?formatTime(s.eval.fillTime):'--'}</span></span>
            </div>
        </div>
    </div>`;
}

function renderDashboards() {
    const running = globalLogs.filter(p => p.state === 'RUNNING');
    const waiting = globalLogs.filter(p => p.state === 'WAITING');
    const closed = globalLogs.filter(p => ['TP','SL','EXPIRED'].includes(p.state));

    document.getElementById('running-section').innerHTML = running.length ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${running.map(buildCard).join('')}</div>` : '';
    document.getElementById('waiting-section').innerHTML = waiting.length ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${waiting.map(buildCard).join('')}</div>` : '';
    document.getElementById('closed-board').innerHTML = closed.length ? closed.map(buildCard).join('') : `<div class="col-span-full text-center py-10 text-[#8a95a5]">Chưa có lệnh nào đóng</div>`;

    // Stats
    const wins = closed.filter(p => p.eval?.netR > 0).length;
    const losses = closed.filter(p => p.eval?.netR < 0).length;
    const totalR = closed.reduce((a,p) => a + (p.eval?.netR || 0), 0);
    const winrate = (wins+losses) > 0 ? (wins/(wins+losses)*100) : 0;

    document.getElementById('stat-running').innerText = running.length;
    document.getElementById('stat-winrate').innerText = winrate.toFixed(1) + '%';
    document.getElementById('stat-partial').innerText = `${wins}W / ${losses}L`;
    document.getElementById('stat-expectancy').innerText = (closed.length > 0 ? (totalR/closed.length).toFixed(2) : '0.00') + 'R';
    document.getElementById('stat-pnl-usd').innerText = (totalR * 10).toFixed(2) + '$';
    document.getElementById('stat-pnl').innerText = (totalR > 0 ? '+' : '') + totalR.toFixed(2) + 'R';
    document.getElementById('stat-count').innerText = `${closed.length} đóng`;

    // Macro
    if (currentBtcRegime) {
        document.getElementById('btc-macro-pos').innerText = '$' + formatPrice(currentBtcRegime.price);
        const d30 = document.getElementById('btc-30d');
        d30.innerText = (currentBtcRegime.ret30 > 0 ? '+' : '') + currentBtcRegime.ret30.toFixed(1) + '%';
        d30.className = `font-mono font-bold text-sm ${currentBtcRegime.ret30 > 3 ? 'text-[#16c784]' : currentBtcRegime.ret30 < -3 ? 'text-[#ea3943]' : 'text-[#8a95a5]'}`;
        
        const routerEl = document.getElementById('router-mode');
        routerEl.innerText = currentBtcRegime.routerMode || 'OFF';
        routerEl.style.color = currentBtcRegime.routerMode === 'V40_BULL' ? '#16c784' : (currentBtcRegime.routerMode === 'SV_BEAR' ? '#ea3943' : '#8a95a5');
        
        const zoneEl = document.getElementById('btc-zone-badge');
        zoneEl.innerText = currentBtcRegime.routerMode === 'V40_BULL' ? 'BULLISH' : (currentBtcRegime.routerMode === 'SV_BEAR' ? 'BEARISH' : 'SIDEWAY');
        zoneEl.className = `px-2.5 py-1 rounded-lg text-[10px] font-black uppercase font-mono ${currentBtcRegime.routerMode==='V40_BULL'?'bg-[#16c784]/15 text-[#16c784] border border-[#16c784]/30':(currentBtcRegime.routerMode==='SV_BEAR'?'bg-[#ea3943]/15 text-[#ea3943] border border-[#ea3943]/30':'bg-[#1a1f28] text-[#8a95a5] border border-[#232932]')}`;
    }
}

async function loadLiveData(manual = false) {
    if(manual) document.getElementById('scan-status').innerText = 'Đang tải dữ liệu...';
    try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error('Lỗi tải file data.json');
        const data = await res.json();
        
        globalLogs = Object.values(data.positions || {});
        currentBtcRegime = data.btcRegime || { price: 0, ret30: 0, routerMode: 'OFF' };
        
        const now = new Date();
        document.getElementById('scan-status').innerText = `Cập nhật: ${now.toLocaleTimeString('vi-VN')} (${globalLogs.length} kèo)`;
        renderDashboards();
    } catch (e) {
        document.getElementById('scan-status').innerText = 'Lỗi: ' + e.message;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    switchMainTab('opp');
    loadLiveData();
    setInterval(() => loadLiveData(), 30000); // Tự động cập nhật mỗi 30s
});
</script>
</body>
</html>
